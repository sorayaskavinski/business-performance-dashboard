{% extends "base.html" %}

{% block content %}
<div class="row mb-4">
    <div class="col-md-12 d-flex justify-content-between align-items-center">
        <h2>Add New Sale</h2>
        <a href="{% url 'home' %}" class="btn btn-outline-secondary btn-sm">← Back to Home</a>
    </div>
</div>

<div class="card shadow">
    <div class="card-header text-white" style="background-color: #01305f;">
        <h5 class="card-title mb-0">Sale Details</h5>
    </div>
    <div class="card-body">
        <form method="POST" action="{% url 'add_sale' %}">
            {% csrf_token %}
            <div class="row g-3">
                <!-- Date -->
                <div class="col-md-4">
                    <label for="date" class="form-label fw-bold">Date</label>
                    <input type="date" class="form-control" id="date" name="date" required>
                </div>

                <!-- Product -->
                <div class="col-md-4">
                    <label for="product" class="form-label fw-bold">Product</label>
                    <input type="text" class="form-control" id="product" name="product" placeholder="e.g. Laptop" required>
                </div>

                <!-- Category -->
                <div class="col-md-4">
                    <label for="category" class="form-label fw-bold">Category</label>
                    <input type="text" class="form-control" id="category" name="category" placeholder="e.g. Electronics" required>
                </div>

                <!-- Salesperson -->
                <div class="col-md-4">
                    <label for="salesperson" class="form-label fw-bold">Salesperson</label>
                    <input type="text" class="form-control" id="salesperson" name="salesperson" placeholder="e.g. John Doe" required>
                </div>

                <!-- Region -->
                <div class="col-md-4">
                    <label for="region" class="form-label fw-bold">Region</label>
                    <input type="text" class="form-control" id="region" name="region" placeholder="e.g. North America" required>
                </div>

                <!-- Quantity -->
                <div class="col-md-2">
                    <label for="quantity" class="form-label fw-bold">Quantity</label>
                    <input type="number" min="1" value="1" class="form-control" id="quantity" name="quantity" required>
                </div>

                <!-- Unit Price -->
                <div class="col-md-2">
                    <label for="unit_price" class="form-label fw-bold">Unit Price ($)</label>
                    <input type="number" step="0.01" min="0" placeholder="0.00" class="form-control" id="unit_price" name="unit_price" required>
                </div>

                <!-- Form Action Buttons -->
                <div class="col-md-12 d-flex justify-content-between align-items-center mt-4">
                    <a href="{% url 'home' %}" class="btn btn-outline-secondary">
                        Cancel
                    </a>
                    <button type="submit" class="btn btn-warning fw-bold">
                        Add Sale
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
