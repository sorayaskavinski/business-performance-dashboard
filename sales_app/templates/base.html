<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Sales Performance Dashboard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark" style="background-color:#01305f;">

    <div class="container">

        <a class="navbar-brand" href="{% url 'home' %}">

            Sales Performance

        </a>

    </div>

</nav>

<div class="container mt-5">

    <!-- Pop-up/Alerts -->
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show shadow-sm" role="alert">
                {% if message.tags == 'success' %}
                    ✅
                {% endif %}
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endfor %}
    {% endif %}

    {% block content %}
    {% endblock %}

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
<footer class="bg-dark text-white text-center py-3 mt-5">

    <div class="container">

        <p class="mb-0">&copy; 2026 Sales Performance Dashboard. All rights reserved.</p>
        <p class="mb-0">Developed by Soraya Skavinski</p>

    </div>
</html>
