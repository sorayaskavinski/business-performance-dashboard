{% extends "base.html" %}

{% block content %}
<div class="row mb-4">
    <div class="col-md-12 d-flex justify-content-between align-items-center">
        <h2>Edit Sale Record</h2>
        <a href="{% url 'search_sales' %}" class="btn btn-outline-secondary btn-sm">← Cancel & Back</a>
    </div>
</div>

<div class="card shadow">
    <div class="card-header text-white" style="background-color: #01305f;">
        <h5 class="card-title mb-0">Update Information</h5>
    </div>
    <div class="card-body">
        <form method="POST" action="{% url 'update_sale' sale.id %}">
            {% csrf_token %}
            <div class="row g-3">
                <!-- Date -->
                <div class="col-md-4">
                    <label for="date" class="form-label font-weight-bold">Date</label>
                    <input type="date" class="form-control" id="date" name="date" value="{{ sale.Date }}" required>
                </div>

                <!-- Product -->
                <div class="col-md-4">
                    <label for="product" class="form-label font-weight-bold">Product</label>
                    <input type="text" class="form-control" id="product" name="product" value="{{ sale.Product }}" required>
                </div>

                <!-- Category -->
                <div class="col-md-4">
                    <label for="category" class="form-label font-weight-bold">Category</label>
                    <input type="text" class="form-control" id="category" name="category" value="{{ sale.Category }}" required>
                </div>

                <!-- Salesperson -->
                <div class="col-md-4">
                    <label for="salesperson" class="form-label font-weight-bold">Salesperson</label>
                    <input type="text" class="form-control" id="salesperson" name="salesperson" value="{{ sale.SalesPerson }}" required>
                </div>

                <!-- Region -->
                <div class="col-md-4">
                    <label for="region" class="form-label font-weight-bold">Region</label>
                    <input type="text" class="form-control" id="region" name="region" value="{{ sale.Region }}" required>
                </div>

                <!-- Quantity -->
                <div class="col-md-2">
                    <label for="quantity" class="form-label font-weight-bold">Quantity</label>
                    <input type="number" min="1" class="form-control" id="quantity" name="quantity" value="{{ sale.Quantity }}" required>
                </div>

                <!-- Unit Price -->
                <div class="col-md-2">
                    <label for="unit_price" class="form-label font-weight-bold">Unit Price ($)</label>
                    <input type="number" step="0.01" min="0" class="form-control" id="unit_price" name="unit_price" value="{{ sale.UnitPrice }}" required>
                </div>

                <!-- Form Action Buttons -->
                <div class="col-md-12 d-flex justify-content-between align-items-center mt-4">
                    <a href="{% url 'search_sales' %}" class="btn btn-outline-secondary">
                        ← Return to Search
                    </a>
                    <button type="submit" class="btn btn-success">
                        Save Changes
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
